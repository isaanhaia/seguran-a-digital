<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Guardiões da Internet</title>

</head>


<body>


    <!-- Elementos do cenário -->

    <div class="nuvem nuvem-1"></div>

    <div class="nuvem nuvem-2"></div>

    <div class="estrela estrela-1"></div>

    <div class="estrela estrela-2"></div>

    <div class="estrela estrela-3"></div>


    <main class="jogo">


        <!-- CABEÇALHO -->

        <header class="topo">

            <div class="logo">
                GI
            </div>

            <div>

                <h1>
                    Guardiões da Internet
                </h1>

                <p>
                    Sua aventura começa agora!
                </p>

            </div>

        </header>


        <!-- MAPA -->

        <div class="mapa">

            <div class="ponto inicio">
                INÍCIO
            </div>

            <div class="linha linha-1"></div>

            <div class="ponto caminho-a">
                A
            </div>

            <div class="ponto caminho-b">
                B
            </div>

            <div class="ponto caminho-c">
                C
            </div>

            <div class="ponto final">
                FINAL
            </div>

        </div>


        <!-- INFORMAÇÕES -->

        <div class="informacoes">

            <div>

                <span>
                    PONTOS
                </span>

                <strong class="pontuacao">
                    0
                </strong>

            </div>


            <div>

                <span>
                    CAMINHO
                </span>

                <strong class="caminho-atual">
                    Início
                </strong>

            </div>

        </div>


        <!-- ÁREA DO JOGO -->

        <section class="cartao">


            <div class="personagem">

                <div class="avatar">
                    GI
                </div>

                <div>

                    <strong class="nome-personagem">
                        Guardião
                    </strong>

                    <span>
                        Missão de segurança
                    </span>

                </div>

            </div>


            <div class="pergunta">

                <h2 class="titulo-pergunta">
                </h2>

            </div>


            <div class="alternativas">
            </div>


            <div class="mensagem">
            </div>


        </section>


        <p class="dica">

            Pense com calma. Cada escolha pode mudar seu caminho.

        </p>


    </main>


    <script src="script.js"></script>

</body>

</html>
